name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: corepack pnpm@10.34.6 install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Lint
        run: corepack pnpm lint
      - name: Engine
        working-directory: packages/engine
        run: corepack pnpm exec vitest run
        env:
          SOLLINE_SKIP_SDK: '1'
      - name: Desktop
        working-directory: apps/desktop
        run: corepack pnpm exec vitest run
