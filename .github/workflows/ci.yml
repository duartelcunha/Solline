name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 é o mínimo do repo. 24 é o Node do Duarte: o EINVAL de um .cmd
        # (CVE-2024-27980) tem de falhar aqui, não só na máquina dele.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # O corpus do M8 aponta para commits antigos. Um clone raso não os tem.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: corepack pnpm@10.34.6 install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Lint
        run: corepack pnpm lint
      - name: UI
        working-directory: packages/ui
        run: corepack pnpm exec vitest run
      - name: Engine
        working-directory: packages/engine
        run: corepack pnpm exec vitest run
        env:
          SOLLINE_SKIP_SDK: '1'
      - name: Desktop
        working-directory: apps/desktop
        run: corepack pnpm exec vitest run
        env:
          # O cofre de credenciais do Windows não existe neste runner.
          SOLLINE_VAULT: ${{ runner.os == 'Windows' && 'skip' || '' }}

  qa-fast:
    name: qa-fast (renderer + distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: corepack pnpm@10.34.6 install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Renderer QA
        run: corepack pnpm qa:renderer
        env:
          SOLLINE_QA_FRESH: '1'
      - name: Production build
        run: corepack pnpm --filter @solline/desktop build
      - name: Distribution check
        run: corepack pnpm qa:distribution
      - name: Upload QA report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-fast-report
          path: |
            apps/desktop/qa-report
            apps/desktop/test-results/qa
          retention-days: 7
